<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>แบบฝึกหัดคณิตศาสตร์: การคำนวณเศษส่วนและจำนวนคละ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; touch-action: manipulation; }
        body { background-color: #f0f4f8; color: #2d3748; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 850px; width: 100%; background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); }
        header { text-align: center; border-bottom: 3px solid #3182ce; padding-bottom: 12px; margin-bottom: 20px; }
        h1 { color: #2b6cb0; margin-bottom: 8px; font-size: 22px; }
        .subtitle { color: #718096; font-size: 15px; margin-bottom: 10px; }
        
        /* Navigation */
        .nav-buttons { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
        .nav-btn { padding: 12px 20px; border: none; border-radius: 8px; background-color: #e2e8f0; color: #4a5568; font-weight: bold; cursor: pointer; transition: all 0.2s; font-size: 15px; flex: 1 1 100%; text-align: center;}
        @media (min-width: 600px) { .nav-btn { flex: 0 1 auto; } }
        .nav-btn.active { background-color: #3182ce; color: white; box-shadow: 0 4px 6px rgba(49, 130, 206, 0.3); }
        .nav-btn:hover:not(.active) { background-color: #cbd5e0; }
        .teacher-btn { background-color: #e53e3e; color: white; }
        .teacher-btn:hover { background-color: #c53030 !important; }
        
        .instruction-box { background-color: #ebf8ff; border-left: 4px solid #3182ce; padding: 12px; border-radius: 4px; margin-bottom: 20px; font-size: 14px; line-height: 1.5; }
        
        /* Problems */
        .problem-card { background: #f7fafc; border: 2px solid #e2e8f0; border-radius: 10px; padding: 15px; margin-bottom: 20px; overflow: hidden; transition: border-color 0.3s ease; }
        .problem-card.done { border-color: #38a169; background-color: #f0fff4; }
        .problem-header { font-size: 16px; font-weight: bold; color: #2c5282; margin-bottom: 15px; display: flex; align-items: flex-start; flex-direction: column; gap: 8px; }
        @media (min-width: 600px) { .problem-header { flex-direction: row; align-items: center; } }
        .badge { background: #3182ce; color: white; padding: 4px 10px; border-radius: 4px; font-size: 13px; transition: background-color 0.3s ease; }
        .problem-card.done .badge { background: #38a169; }
        
        /* Steps */
        .step-container { margin-top: 10px; }
        details { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 8px; padding: 10px 12px; transition: all 0.2s ease; }
        details[open] { border-color: #4299e1; box-shadow: 0 2px 4px rgba(66, 153, 225, 0.1); }
        summary { font-weight: 600; color: #3182ce; cursor: pointer; outline: none; user-select: none; font-size: 15px; }
        .step-desc { font-weight: normal; color: #4a5568; margin-left: 4px; }
        details.completed { border-color: #38a169; }
        details.completed summary::after { content: " ✅"; font-size: 12px; color: #38a169; }
        
        /* Scrollable Math Expression */
        .step-content { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #e2e8f0; display: flex; align-items: center; font-size: 16px; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 8px; }
        .math-expr { display: inline-flex; align-items: center; flex-wrap: nowrap; background: #fff; padding: 6px 10px; border-radius: 6px; border: 1px solid #edf2f7; overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }
        
        /* Custom Scrollbar */
        .step-content::-webkit-scrollbar, .math-expr::-webkit-scrollbar { height: 5px; }
        .step-content::-webkit-scrollbar-thumb, .math-expr::-webkit-scrollbar-thumb { background-color: #cbd5e0; border-radius: 10px; }
        
        /* Math layout */
        .fraction-container { display: inline-flex; align-items: center; margin: 0 3px; }
        .whole-num { font-size: 18px; font-weight: bold; margin-right: 2px; }
        .fraction-block { display: inline-flex; flex-direction: column; align-items: center; line-height: 1; }
        .num { border-bottom: 2px solid #2d3748; padding: 0 4px 4px 4px; font-weight: 600; }
        .den { padding: 4px 4px 0 4px; font-weight: 600; }
        .operator { font-size: 18px; margin: 0 6px; font-weight: bold; color: #e53e3e; }
        .bracket { font-size: 26px; font-weight: 300; color: #4a5568; margin: 0 1px; }
        .equal-sign { font-size: 18px; margin: 0 8px; font-weight: bold; color: #2b6cb0; flex-shrink: 0; }
        .final-answer { background-color: #fff; border: 2px dashed #cbd5e0; padding: 6px 12px; border-radius: 6px; display: inline-flex; align-items: center; transition: all 0.3s ease; }
        .problem-card.done .final-answer { background-color: #c6f6d5; border-color: #38a169; }
        
        /* Complex Fractions */
        .cf-container { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 6px; vertical-align: middle; }
        .cf-num { border-bottom: 3px solid #2b6cb0; padding: 0 6px 6px 6px; display: flex; align-items: center; justify-content: center; }
        .cf-den { padding: 6px 6px 0 6px; display: flex; align-items: center; justify-content: center; }

        /* Inputs */
        .blank-box { width: 38px; height: 32px; border: 1.5px solid #cbd5e0; border-radius: 6px; background-color: #fff; text-align: center; font-size: 16px !important; font-weight: 600; color: #2b6cb0; outline: none; padding: 0; margin: 2px; transition: all 0.2s ease; }
        .blank-box:focus { border-color: #3182ce; background-color: #ebf8ff; box-shadow: 0 0 0 2px rgba(49, 130, 206, 0.2); }
        .whole-box { width: 42px; height: 42px; font-size: 18px !important; margin-right: 4px; }
        .blank-box.correct { background-color: #c6f6d5 !important; border-color: #38a169 !important; color: #22543d !important; box-shadow: none; cursor: default; pointer-events: none;}
        
        /* Summary Page */
        .summary-container { text-align: center; padding: 10px; }
        .score-circle { width: 140px; height: 140px; border-radius: 50%; border: 8px solid #3182ce; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: bold; color: #2b6cb0; margin: 0 auto 20px auto; background: #ebf8ff;}
        .score-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; max-width: 600px; margin: 0 auto; }
        .score-item { padding: 12px; border-radius: 8px; font-weight: bold; font-size: 14px; border: 2px solid #e2e8f0; background: #f7fafc;}
        .score-item.pass { border-color: #38a169; background: #f0fff4; color: #2f855a; }
        .score-item.fail { border-color: #e53e3e; background: #fff5f5; color: #c53030; }
        .section-title { text-align: left; color: #2c5282; max-width: 600px; margin: 0 auto 10px auto; font-size: 18px; border-bottom: 2px solid #e2e8f0; padding-bottom: 6px;}
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>📝 แบบฝึกหัด: เศษส่วนและจำนวนคละ</h1>
        <div class="subtitle">ระบบตรวจคำตอบอัตโนมัติ (ตอบคำตอบสุดท้ายถูก ถือว่าผ่าน!)</div>
    </header>

    <div class="nav-buttons" id="navContainer">
        <button class="nav-btn active page-btn" onclick="switchPage('page1')">หน้าที่ 1 (8 ข้อ)</button>
        <button class="nav-btn page-btn" onclick="switchPage('page2')">หน้าที่ 2 (10 ข้อ)</button>
        <button class="nav-btn page-btn" onclick="switchPage('summary')">🏆 สรุปคะแนน</button>
        <button class="nav-btn teacher-btn" id="teacherBtn" onclick="toggleTeacherMode()">🔐 เฉลยคำตอบ (ผู้ตรวจสอบ)</button>
    </div>

    <div id="appContent"></div>
</div>

<script>
    // --- Helper Functions ---
    function i(ans, isWhole=false) { return `<input type="text" inputmode="numeric" pattern="[0-9]*" class="blank-box ${isWhole?'whole-box':''}" data-answer="${ans}" autocomplete="off">`; }
    function f(n, d) { return `<div class="fraction-container"><div class="fraction-block"><span class="num">${n}</span><span class="den">${d}</span></div></div>`; }
    function wf(w, n, d) { return `<div class="fraction-container"><span class="whole-num">${w}</span><div class="fraction-block"><span class="num">${n}</span><span class="den">${d}</span></div></div>`; }
    function cf(n, d) { return `<div class="cf-container"><div class="cf-num">${n}</div><div class="cf-den">${d}</div></div>`; }
    function op(o) { return `<span class="operator">${o}</span>`; }
    function br(content, type='round') {
        const left = type === 'round' ? '(' : type === 'curly' ? '{' : '[';
        const right = type === 'round' ? ')' : type === 'curly' ? '}' : ']';
        return `<span class="bracket">${left}</span>${content}<span class="bracket">${right}</span>`;
    }
    function ans(content) { return `<div class="final-answer">${content}</div>`; }
    function eq() { return `<span class="equal-sign">=</span>`; }

    // --- Data Definitions ---
    const page1Data = [
        { id: 1, q: br(wf(3,1,8) + op('-') + wf(1,1,4)) + op('×') + br(wf(1,1,3) + op('-') + f(5,6)), steps: [
            { text: "แปลงจำนวนคละทั้งหมดให้เป็นเศษเกิน", math: br(f(i(25),i(8)) + op('-') + f(i(5),i(4))) + op('×') + br(f(i(4),i(3)) + op('-') + f(i(5),i(6))) },
            { text: "ทำตัวส่วนในแต่ละวงเล็บให้เท่ากันเพื่อทำการลบ", math: br(f(i(25),i(8)) + op('-') + f(i(10),i(8))) + op('×') + br(f(i(8),i(6)) + op('-') + f(i(5),i(6))) },
            { text: "คำนวณผลลบในแต่ละวงเล็บ", math: f(i(15),i(8)) + op('×') + f(i(3),i(6)) },
            { text: "ตัดทอนเป็นเศษส่วนอย่างต่ำเพื่อให้คูณง่ายขึ้น", math: f(i(15),i(8)) + op('×') + f(i(1),i(2)) },
            { text: "นำเศษคูณเศษ ส่วนคูณส่วน", math: ans(f(i(15),i(16))) }
        ]},
        { id: 2, q: br(wf(12,5,6) + op('÷') + wf(8,5,9)) + op('-') + br(wf(14,3,7) + op('÷') + wf(12,5,8)), steps: [
            { text: "แปลงจำนวนคละทั้งหมดให้เป็นเศษเกิน", math: br(f(i(77),i(6)) + op('÷') + f(i(77),i(9))) + op('-') + br(f(i(101),i(7)) + op('÷') + f(i(101),i(8))) },
            { text: "เปลี่ยนเครื่องหมายหารเป็นคูณ แล้วกลับเศษเป็นส่วน", math: br(f(i(77),i(6)) + op('×') + f(i(9),i(77))) + op('-') + br(f(i(101),i(7)) + op('×') + f(i(8),i(101))) },
            { text: "ตัดทอนตัวเลขในแต่ละวงเล็บ", math: f(i(9),i(6)) + op('-') + f(i(8),i(7)) },
            { text: "ทอนเป็นเศษส่วนอย่างต่ำและทำส่วนให้เท่ากัน", math: f(i(3),i(2)) + op('-') + f(i(8),i(7)) + eq() + f(i(21),i(14)) + op('-') + f(i(16),i(14)) },
            { text: "ลบเศษส่วน", math: ans(f(i(5),i(14))) }
        ]},
        { id: 3, q: br(wf(5,5,6) + op('-') + wf(3,3,8)) + op('+') + br(wf(1,2,3) + op('-') + f(7,6)), steps: [
            { text: "แปลงจำนวนคละให้เป็นเศษเกิน", math: br(f(i(35),i(6)) + op('-') + f(i(27),i(8))) + op('+') + br(f(i(5),i(3)) + op('-') + f(i(7),i(6))) },
            { text: "ทำส่วนในแต่ละวงเล็บให้เท่ากัน", math: br(f(i(140),i(24)) + op('-') + f(i(81),i(24))) + op('+') + br(f(i(10),i(6)) + op('-') + f(i(7),i(6))) },
            { text: "คำนวณผลลบในแต่ละวงเล็บ", math: f(i(59),i(24)) + op('+') + f(i(3),i(6)) },
            { text: "ทำตัวส่วนให้เท่ากันก่อนนำมาบวกกัน", math: f(i(59),i(24)) + op('+') + f(i(12),i(24)) },
            { text: "บวกเศษส่วนเข้าด้วยกัน", math: f(i(71),i(24)) },
            { text: "เปลี่ยนจากเศษเกินให้เป็นจำนวนคละ", math: ans(wf(i(2,true),i(23),i(24))) }
        ]},
        { id: 4, q: br(wf(2,5,9) + op('+') + wf(4,1,6)) + op('-') + br(wf(1,5,15) + op('+') + wf(1,5,6)), steps: [
            { text: "แปลงจำนวนคละเป็นเศษเกิน", math: br(f(i(23),i(9)) + op('+') + f(i(25),i(6))) + op('-') + br(f(i(20),i(15)) + op('+') + f(i(11),i(6))) },
            { text: "ทำส่วนให้เท่ากันเพื่อบวก (ทอนวงเล็บหลังเป็นอย่างต่ำก่อน)", math: br(f(i(46),i(18)) + op('+') + f(i(75),i(18))) + op('-') + br(f(i(8),i(6)) + op('+') + f(i(11),i(6))) },
            { text: "หาผลบวกในแต่ละวงเล็บ", math: f(i(121),i(18)) + op('-') + f(i(19),i(6)) },
            { text: "ทำส่วนให้เท่ากันเพื่อเตรียมลบ", math: f(i(121),i(18)) + op('-') + f(i(57),i(18)) },
            { text: "ลบและแปลงเป็นจำนวนคละ", math: ans(wf(i(3,true),i(5),i(9))) }
        ]},
        { id: 5, q: wf(5,4,7) + op('-') + wf(3,5,6) + op('+') + wf(1,5,21), steps: [
            { text: "แปลงจำนวนคละเป็นเศษเกินทั้งหมด", math: f(i(39),i(7)) + op('-') + f(i(23),i(6)) + op('+') + f(i(26),i(21)) },
            { text: "หา ค.ร.น. และทำตัวส่วนให้เท่ากัน", math: f(i(234),i(42)) + op('-') + f(i(161),i(42)) + op('+') + f(i(52),i(42)) },
            { text: "คำนวณจากซ้ายไปขวา (ลบตัวหน้าก่อน)", math: f(i(73),i(42)) + op('+') + f(i(52),i(42)) },
            { text: "บวกและแปลงเป็นจำนวนคละ", math: ans(wf(i(2,true),i(41),i(42))) }
        ]},
        { id: 6, q: f(2,3) + op('-') + br( br(f(1,4) + op('-') + f(1,12)) + op('÷') + f(1,3) , 'curly'), steps: [
            { text: "ทำส่วนในวงเล็บกลมให้เท่ากัน", math: f(i(2),i(3)) + op('-') + br( br(f(i(3),i(12)) + op('-') + f(i(1),i(12))) + op('÷') + f(i(1),i(3)) , 'curly') },
            { text: "ลบในวงเล็บกลม และเปลี่ยนหารเป็นคูณ", math: f(i(2),i(3)) + op('-') + br( f(i(2),i(12)) + op('×') + f(i(3),i(1)) , 'curly') },
            { text: "คูณในวงเล็บปีกกาและทอนให้ต่ำ", math: f(i(2),i(3)) + op('-') + f(i(1),i(2)) },
            { text: "ทำส่วนให้เท่ากันเพื่อลบ", math: f(i(4),i(6)) + op('-') + f(i(3),i(6)) },
            { text: "หาคำตอบสุดท้าย", math: ans(f(i(1),i(6))) }
        ]},
        { id: 7, q: br( br( br(wf(1,2,3) + op('+') + f(3,5)) + op('-') + wf(1,1,4) , 'curly') + op('×') + wf(1,7,8) , 'square') + op('÷') + wf(5,1,12), steps: [
            { text: "แปลงเป็นเศษเกินทั้งหมด", math: br( br( br(f(i(5),i(3)) + op('+') + f(i(3),i(5))) + op('-') + f(i(5),i(4)) , 'curly') + op('×') + f(i(15),i(8)) , 'square') + op('÷') + f(i(61),i(12)) },
            { text: "ทำส่วนให้เท่ากันเพื่อบวกในวงเล็บกลม", math: br( br( br(f(i(25),i(15)) + op('+') + f(i(9),i(15))) + op('-') + f(i(5),i(4)) , 'curly') + op('×') + f(i(15),i(8)) , 'square') + op('÷') + f(i(61),i(12)) },
            { text: "บวกในวงเล็บกลม และเปลี่ยนตัวหารด้านหลังเป็นคูณ", math: br( br( f(i(34),i(15)) + op('-') + f(i(5),i(4)) , 'curly') + op('×') + f(i(15),i(8)) , 'square') + op('×') + f(i(12),i(61)) },
            { text: "ทำส่วนในวงเล็บปีกกาให้เท่ากัน", math: br( br( f(i(136),i(60)) + op('-') + f(i(75),i(60)) , 'curly') + op('×') + f(i(15),i(8)) , 'square') + op('×') + f(i(12),i(61)) },
            { text: "ผลลบวงเล็บปีกกา และเตรียมคูณในวงเล็บเหลี่ยม", math: br( f(i(61),i(60)) + op('×') + f(i(15),i(8)) , 'square') + op('×') + f(i(12),i(61)) },
            { text: "ผลคูณวงเล็บเหลี่ยม (ตัดทอนตัวเลข)", math: f(i(61),i(32)) + op('×') + f(i(12),i(61)) },
            { text: "หาคำตอบสุดท้าย", math: ans(f(i(3),i(8))) }
        ]},
        { id: 8, q: wf(1,5,14) + op('+') + br( wf(3,1,9) + op('÷') + br( wf(2,3,16) + op('×') + br( wf(1,4,5) + op('-') + f(5,9) ), 'curly') , 'square'), steps: [
            { text: "แปลงเป็นเศษเกินและทำส่วนให้เท่ากันในวงเล็บกลม", math: f(i(19),i(14)) + op('+') + br( f(i(28),i(9)) + op('÷') + br( f(i(35),i(16)) + op('×') + br( f(i(81),i(45)) + op('-') + f(i(25),i(45)) ) , 'curly') , 'square') },
            { text: "ลบในวงเล็บกลม", math: f(i(19),i(14)) + op('+') + br( f(i(28),i(9)) + op('÷') + br( f(i(35),i(16)) + op('×') + f(i(56),i(45)) , 'curly') , 'square') },
            { text: "คูณในวงเล็บปีกกาและทำเป็นเศษส่วนอย่างต่ำ", math: f(i(19),i(14)) + op('+') + br( f(i(28),i(9)) + op('÷') + f(i(49),i(18)) , 'square') },
            { text: "เปลี่ยนหารเป็นคูณในวงเล็บก้ามปู และกลับเศษเป็นส่วน", math: f(i(19),i(14)) + op('+') + br( f(i(28),i(9)) + op('×') + f(i(18),i(49)) , 'square') },
            { text: "ผลคูณวงเล็บก้ามปู", math: f(i(19),i(14)) + op('+') + f(i(8),i(7)) },
            { text: "ทำส่วนให้เท่ากันเพื่อบวกเศษส่วน", math: f(i(19),i(14)) + op('+') + f(i(16),i(14)) },
            { text: "หาคำตอบสุดท้าย (แปลงเป็นจำนวนคละ)", math: ans(wf(i(2,true),i(1),i(2))) }
        ]}
    ];

    const page2Data = [
        { id: 9, q: cf(f(2,3), '4') + op('+') + cf('5', f(6,7)), steps: [
            { text: "แยกเศษส่วนซ้อนให้อยู่ในรูปการคูณ", math: br( f(i(2),i(3)) + op('×') + f(i(1),i(4)) ) + op('+') + br( i(5) + op('×') + f(i(7),i(6)) ) },

            { text: "หาคำตอบสุดท้าย (ผลลัพธ์ติดลบ)", math: ans(op('-') + wf(i(8,true), i(1), i(2))) }

    // --- State Management ---
    const scores = {}; 
    for(let i=1; i<=18; i++) scores[i] = false;
    let isTeacherMode = false;

    const appContent = document.getElementById('appContent');

    // --- Render Engine ---
    function renderProblems(dataArray) {
        let html = `<div class="instruction-box">💡 <strong>คำแนะนำ:</strong> สามารถเลือกทำขั้นตอนไหนก่อนก็ได้ <strong>หากเติม "คำตอบสุดท้าย" ถูกต้อง จะถือว่าทำข้อนั้นเสร็จสมบูรณ์ทันที! ✅</strong></div>`;
        
        dataArray.forEach((prob, index) => {
            let displayNum = index + 1; 
            let isProbDone = scores[prob.id] ? 'done' : '';

            html += `
            <div class="problem-card ${isProbDone}" id="prob-${prob.id}">
                <div class="problem-header">
                    <span class="badge">ข้อที่ ${displayNum}</span> 
                    <div class="math-expr">${prob.q}</div>
                </div>
                <div class="step-container">`;
            
            prob.steps.forEach((step, idx) => {
                let isLast = idx === prob.steps.length - 1;
                html += `
                <details class="step-item" data-prob="${prob.id}" data-step="${idx}" open>
                    <summary>ขั้นที่ ${idx + 1}: <span class="step-desc">${step.text}</span> ${isLast ? ' <b>(คำตอบสุดท้าย)</b>' : ''}</summary>
                    <div class="step-content">
                        ${eq()} <div class="math-expr">${step.math}</div>
                    </div>
                </details>`;
            });

            html += `</div></div>`;
        });
        
        appContent.innerHTML = html;
        attachInteractions();
    }

    function renderSummary() {
        let total = 18;
        let correctCount = Object.values(scores).filter(v => v).length;
        
        let html = `
        <div class="summary-container">
            <h2>ผลคะแนนรวมของคุณ</h2>
            <div class="score-circle">${correctCount} / ${total}</div>
            <p style="color: #4a5568; margin-bottom: 20px;">คุณทำโจทย์เสร็จสมบูรณ์ไปแล้ว <strong>${correctCount}</strong> ข้อ จากทั้งหมด ${total} ข้อ</p>
            
            <h3 class="section-title">📄 หน้าที่ 1</h3>
            <div class="score-list" style="margin-bottom: 25px;">`;
            
        for(let i = 1; i <= 8; i++) {
            let passed = scores[i];
            html += `<div class="score-item ${passed ? 'pass' : 'fail'}">
                ข้อ ${i}: ${passed ? '✅ ผ่าน' : '❌ ยังไม่ผ่าน'}
            </div>`;
        }
        
        html += `</div>
            <h3 class="section-title">📄 หน้าที่ 2</h3>
            <div class="score-list">`;
            
        for(let i = 9; i <= 18; i++) {
            let passed = scores[i];
            html += `<div class="score-item ${passed ? 'pass' : 'fail'}">
                ข้อ ${i - 8}: ${passed ? '✅ ผ่าน' : '❌ ยังไม่ผ่าน'}
            </div>`;
        }
        
        html += `</div></div>`;
        appContent.innerHTML = html;
    }

    function switchPage(page) {
        document.querySelectorAll('.page-btn').forEach(btn => btn.classList.remove('active'));
        if(event && event.target.classList.contains('page-btn')) {
            event.target.classList.add('active');
        } else {
            // Fallback for auto-switching
            if(page === 'page1') document.querySelectorAll('.page-btn')[0].classList.add('active');
            else if(page === 'page2') document.querySelectorAll('.page-btn')[1].classList.add('active');
        }
        window.scrollTo({ top: 0, behavior: 'smooth' }); 
        
        if (page === 'page1') renderProblems(page1Data);
        else if (page === 'page2') renderProblems(page2Data);
        else if (page === 'summary') renderSummary();
    }

    // --- Teacher Mode Logic ---
    function toggleTeacherMode() {
        if (isTeacherMode) {
            isTeacherMode = false;
            alert("ปิดโหมดผู้สอนแล้ว (ระบบจะรีเฟรชหน้าเว็บเพื่อเริ่มใหม่)");
            location.reload(); 
            return;
        }

        const pwd = prompt("กรุณาใส่รหัสผ่านสำหรับผู้ตรวจสอบ:");
        // รหัสผ่านคือ 9999
        if (pwd === "9999") {
            isTeacherMode = true;
            document.getElementById('teacherBtn').innerText = "🔓 ปิดโหมดผู้ตรวจสอบ";
            alert("รหัสผ่านถูกต้อง! ระบบกำลังแสดงเฉลยทั้งหมด...");
            
            // ให้คะแนนเต็ม
            for(let i=1; i<=18; i++) scores[i] = true;
            
            // รีโหลดหน้าที่กำลังดูอยู่เพื่อแสดงเฉลย
            const activeNav = document.querySelector('.nav-btn.active').innerText;
            if(activeNav.includes('1')) switchPage('page1');
            else if(activeNav.includes('2')) switchPage('page2');
            else switchPage('summary');
            
        } else if (pwd !== null) {
            alert("รหัสผ่านไม่ถูกต้อง!");
        }
    }

    // --- Interactive Logic ---
    function attachInteractions() {
        const inputs = document.querySelectorAll('.blank-box');
        
        inputs.forEach(input => {
            // ถ้าเป็นโหมดครู หรือเคยตอบถูกไปแล้ว ให้เติมคำตอบอัตโนมัติและล็อกไว้
            if(isTeacherMode || input.value.trim() === input.getAttribute('data-answer')) {
                if(isTeacherMode) input.value = input.getAttribute('data-answer');
                input.classList.add('correct');
                input.readOnly = true;
            }

            input.addEventListener('input', function() {
                const correctAnswer = this.getAttribute('data-answer');
                
                if (this.value.trim() === correctAnswer) {
                    this.classList.add('correct');
                    this.readOnly = true; 
                    this.blur(); 
                } else {
                    this.classList.remove('correct');
                }

                const currentStep = this.closest('.step-item');
                const probId = currentStep.getAttribute('data-prob');
                const allInputsInStep = currentStep.querySelectorAll('.blank-box');
                
                let isStepCompleted = true;
                allInputsInStep.forEach(inp => {
                    if (!inp.classList.contains('correct')) isStepCompleted = false;
                });

                if (isStepCompleted) {
                    currentStep.classList.add('completed');
                }

                // Check final step
                const stepContainer = currentStep.closest('.step-container');
                const allStepsInProb = Array.from(stepContainer.querySelectorAll('.step-item'));
                const lastStep = allStepsInProb[allStepsInProb.length - 1];
                const allInputsInLastStep = lastStep.querySelectorAll('.blank-box');

                let isLastStepCompleted = true;
                allInputsInLastStep.forEach(inp => {
                    if (!inp.classList.contains('correct')) isLastStepCompleted = false;
                });

                if (isLastStepCompleted) {
                    scores[probId] = true;
                    const probCard = document.getElementById('prob-' + probId);
                    if (probCard) probCard.classList.add('done');
                }
            });
        });

        // จัดการ UI สำหรับโหมดครู
        if (isTeacherMode) {
            document.querySelectorAll('.step-item').forEach(step => step.classList.add('completed'));
            document.querySelectorAll('.problem-card').forEach(card => card.classList.add('done'));
        }
    }

    // Initialize first page
    renderProblems(page1Data);

</script>
